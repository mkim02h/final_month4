{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
    <div class="mx-auto" style="max-width: 420px;">
        <h1 class="h3 mb-4">Вход</h1>

        <form method="post" class="django-form" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>

        {% url 'register' as register_url %}
        {% if register_url %}
            <p class="text-center text-body-secondary mt-3 mb-0">
                Нет аккаунта? <a href="{{ register_url }}">Зарегистрироваться</a>
            </p>
        {% endif %}
    </div>
{% endblock %}
