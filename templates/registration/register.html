{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <div class="mx-auto" style="max-width: 460px;">
        <h1 class="h3 mb-4">Регистрация</h1>

        <form method="post" class="django-form" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
        </form>

        <p class="text-center text-body-secondary mt-3 mb-0">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
    </div>
{% endblock %}
